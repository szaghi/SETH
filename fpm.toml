name = "SETH"
version = "0.2.0"
license = "GPL-3.0-or-later OR BSD-2-Clause OR BSD-3-Clause OR MIT"
author = "Stefano Zaghi"
maintainer = "stefano.zaghi@gmail.com"
copyright = "Copyright 2026 Stefano Zaghi"
homepage = "https://github.com/szaghi/SETH"
description = "Smoothness-weighted ENO, TENO and Hybrids: high-order non-oscillatory reconstruction and interpolation for HPC"

[dependencies]
PENF = { git="https://github.com/szaghi/PENF.git", branch="master" }

# the tests take their time integrators from SELAH (SELAH issue #2); FUNDAL comes with SELAH's own manifest
[dev-dependencies]
SELAH = { git="https://github.com/szaghi/SELAH.git", branch="main" }

[library]
source-dir = "src/lib"

[build]
auto-executables = false
auto-tests = false
auto-examples = false


[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[install]
library = true

[[test]]
name = "seth_test_kinds"
source-dir = "src/tests"
main = "seth_test_kinds.F90"

