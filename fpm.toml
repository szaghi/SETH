name = "SETH"
version = "0.0.1"
license = "GPL-3.0"
author = "Stefano Zaghi"
maintainer = "stefano.zaghi@gmail.com"
copyright = "Copyright 2026 Stefano Zaghi"
homepage = "https://github.com/szaghi/SETH"
description = "Smoothness-weighted ENO, TENO and Hybrids: high-order non-oscillatory reconstruction and interpolation for HPC"

[dependencies]
PENF = { git="https://github.com/szaghi/PENF.git", branch="master" }

[library]
source-dir = "src/lib"

[build]
auto-executables = false
auto-tests = false
auto-examples = false


[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[install]
library = true

[[test]]
name = "seth_test_kinds"
source-dir = "src/tests"
main = "seth_test_kinds.F90"

[[test]]
name = "seth_test_weno_js_adam"
source-dir = "src/tests"
main = "seth_test_weno_js_adam.F90"

[[test]]
name = "seth_test_weno_js_order"
source-dir = "src/tests"
main = "seth_test_weno_js_order.F90"

[[test]]
name = "seth_test_weno_js_eno"
source-dir = "src/tests"
main = "seth_test_weno_js_eno.F90"

[[test]]
name = "seth_test_wenoz"
source-dir = "src/tests"
main = "seth_test_wenoz.F90"

[[test]]
name = "seth_test_teno"
source-dir = "src/tests"
main = "seth_test_teno.F90"
